name: Build WinXP Emulator

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # Исправление ошибки MSB1003: указываем явный файл проекта в корне
    - name: Restore dependencies
      run: dotnet restore WinXPEmulator.csproj
      
    - name: Build
      run: dotnet build WinXPEmulator.csproj --no-restore -c Release
